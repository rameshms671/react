<!DOCTYPE html>
<html>
  <head>
    <title>ShopEasy - Your Online Store</title>
    <link rel="stylesheet" href="styles/styles.css">
    <style>
        body {
            margin: 0;
        }

        .app-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: rgb(222, 222, 222);
        }

        button {
            background-color: rgb(1,125,255);
            width: 150px;
            border-style: none;
            padding: 10px;
            margin: 10px;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        button:hover {
            background-color: rgb(1,75,255);
        }

        button:active {
            transform: scale(0.99);
            box-shadow: inset 0px 2px 5px rgb(0,0,0,0.2);
        }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    
   
    <!-- Main -->
    <script type="text/babel">
        function App() {
            const [ count, setCount ] = React.useState(0);

            const clickButtonElem = React.useRef(null);

            function handleAutoClick(){
                setInterval(
                    () => {
                        if(clickButtonElem.current){
                            clickButtonElem.current.click();
                        }
                    },
                    1000
                )
            }

            return (
                <div className="app-container">
                    <button
                        ref={clickButtonElem}
                        onClick={() => setCount(count + 1)}>
                    Clicked {count} {count == 1 ? "time": "times"}
                    </button>
                    <button
                        onClick={() => setCount(0)}>
                        Reset
                    </button>
                    <button
                        onClick={handleAutoClick}
                        >
                        Auto Click
                    </button>
                </div>
            );
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
